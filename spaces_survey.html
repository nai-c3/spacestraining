<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spaces Schulung – Dein Profil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800;900&family=Young+Serif&display=swap" rel="stylesheet">
<style>
/* Design: Linkedin-Niklas – ein Grund, eine Akzentfarbe, eine Aussage */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ultramarine: #3F37FF; --cobalt: #023FA5; --midnight: #240D57; --violet: #592795;
  --rust: #CE4000; --sun: #FBC507; --paper: #ECEDDF; --white: #FFFFFF;
  --hairline: rgba(36,13,87,0.14);
  --font-display: "PP Agrandir Grand Heavy", "PPAgrandir-GrandHeavy", "PP Agrandir", "Unbounded", system-ui, sans-serif;
  --font-serif: "Young Serif Light", "YoungSerif-Light", "Young Serif", Georgia, serif;
  --margin: 24px; --halftone-pitch: 14px; --radius-badge: 10px;
}
body { background: var(--paper); color: var(--midnight); font-family: var(--font-serif); font-weight: 300; min-height: 100vh; padding-bottom: 64px; -webkit-font-smoothing: antialiased; }
.disp { font-family: var(--font-display); font-weight: 800; text-transform: uppercase; letter-spacing: -0.05em; }

/* HERO – ultramarine Grund, paper Headline, cobalt Halftone */
.hero { position: relative; overflow: hidden; background: var(--ultramarine); color: var(--paper); padding: 40px var(--margin) 28px; min-height: 240px; display: flex; flex-direction: column; justify-content: flex-end; }
.hero .ht { position: absolute; inset: 0; background-image: radial-gradient(circle, var(--cobalt) 34%, transparent 36%); background-size: var(--halftone-pitch) var(--halftone-pitch);
  -webkit-mask: radial-gradient(ellipse 45% 60% at 82% 28%, #000 55%, transparent 72%); mask: radial-gradient(ellipse 45% 60% at 82% 28%, #000 55%, transparent 72%); }
.hero .kicker { position: relative; font-family: var(--font-display); font-weight: 800; font-size: 12px; letter-spacing: 0; text-transform: uppercase; color: var(--sun); margin-bottom: 14px; }
.hero h1 { position: relative; font-size: 44px; line-height: 0.95; }
.hero p { position: relative; font-size: 17px; line-height: 1.35; margin-top: 14px; max-width: 30ch; }

.name-section { padding: 28px var(--margin); background: var(--paper); border-bottom: 1.5px solid var(--hairline); }
.field-label { font-family: var(--font-display); font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0; color: var(--violet); margin-bottom: 10px; display: block; }
.name-section input { width: 100%; background: var(--white); border: none; border-radius: 0; padding: 16px; font-family: var(--font-display); font-size: 20px; font-weight: 800; letter-spacing: -0.03em; text-transform: uppercase; color: var(--midnight); outline: 3px solid transparent; outline-offset: 0; transition: outline-color 0.2s; }
.name-section input:focus { outline-color: var(--ultramarine); }
.name-section input::placeholder { font-family: var(--font-serif); font-weight: 300; text-transform: none; letter-spacing: 0; color: var(--violet); opacity: 0.7; }

.q-item { background: var(--paper); padding: 26px var(--margin); border-bottom: 1.5px solid var(--hairline); }
.q-meta { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
.q-num { font-family: var(--font-display); font-size: 16px; font-weight: 800; letter-spacing: -0.05em; color: var(--paper); background: var(--midnight); width: 40px; height: 40px; border-radius: var(--radius-badge); display: grid; place-items: center; flex-shrink: 0; }
.q-title { font-family: var(--font-display); font-size: 19px; line-height: 1.05; font-weight: 800; text-transform: uppercase; letter-spacing: -0.05em; color: var(--midnight); }

/* SLIDER – flache Linie, sun-Punkt */
input[type=range] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 6px;
  border-radius: 0; outline: none; cursor: pointer;
  background: var(--midnight);
  margin: 6px 0 14px; display: block;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 32px; height: 32px; border-radius: 50%;
  background: var(--sun); border: 4px solid var(--midnight); cursor: pointer; transition: transform 0.1s;
}
input[type=range]::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: var(--sun); border: 4px solid var(--midnight); cursor: pointer; }
input[type=range]:active::-webkit-slider-thumb { transform: scale(1.15); }
input[type=range]:focus-visible { outline: 3px solid var(--ultramarine); outline-offset: 8px; }

.poles { display: flex; justify-content: space-between; gap: 16px; }
.pole { font-family: var(--font-serif); font-size: 15px; line-height: 1.25; color: var(--violet); max-width: 45%; }
.pole.right { text-align: right; }

.submit-area { padding: 32px var(--margin) 0; }
button#submit-btn { width: 100%; background: var(--midnight); color: var(--sun); border: none; border-radius: 0; padding: 20px; font-family: var(--font-display); font-size: 20px; font-weight: 800; text-transform: uppercase; letter-spacing: -0.03em; cursor: pointer; transition: background 0.2s, transform 0.1s; }
button#submit-btn:hover { background: var(--violet); }
button#submit-btn:focus-visible { outline: 3px solid var(--ultramarine); outline-offset: 3px; }
button#submit-btn:active { transform: scale(0.98); }
button#submit-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.status { margin-top: 14px; font-family: var(--font-serif); font-size: 16px; text-align: center; color: var(--rust); min-height: 22px; }

/* DANKE – midnight Grund, sun Headline */
.success-screen { display: none; position: relative; overflow: hidden; flex-direction: column; justify-content: space-between; min-height: 100vh; padding: 40px var(--margin); background: var(--midnight); color: var(--paper); }
.success-screen .ht { position: absolute; inset: 0; background-image: radial-gradient(circle, var(--violet) 36%, transparent 38%); background-size: var(--halftone-pitch) var(--halftone-pitch);
  -webkit-mask: radial-gradient(circle at 70% 45%, #000 25%, transparent 55%); mask: radial-gradient(circle at 70% 45%, #000 25%, transparent 55%); }
.checkmark { position: relative; width: 72px; height: 72px; border-radius: 50%; background: var(--sun); color: var(--midnight); display: grid; place-items: center; font-family: var(--font-display); font-size: 34px; font-weight: 900; }
.success-screen h2 { position: relative; font-size: 64px; line-height: 0.95; color: var(--sun); margin-bottom: 18px; }
.success-screen p { position: relative; font-family: var(--font-serif); font-size: 19px; line-height: 1.35; color: var(--paper); max-width: 28ch; }
</style>
</head>
<body>

<div id="main-form">
  <header class="hero">
    <div class="ht"></div>
    <div class="kicker">Freepik Spaces · Schulung</div>
    <h1 class="disp">Dein<br>KI-Profil.</h1>
    <p>Zehn Regler, ehrliche Einschätzung. Ganz links heißt: gar nicht – ganz rechts: voll und ganz.</p>
  </header>

  <div class="name-section">
    <label class="field-label">Dein Name</label>
    <input type="text" id="name-input" placeholder="Vorname reicht" autocomplete="off">
  </div>

  <div id="questions"></div>

  <div class="submit-area">
    <button id="submit-btn" onclick="submitData()">Abschicken →</button>
    <div class="status" id="status"></div>
  </div>
</div>

<div class="success-screen" id="success-screen">
  <div class="ht"></div>
  <div class="checkmark">✓</div>
  <div>
    <h2 class="disp">Danke.</h2>
    <p>Dein Profil ist gespeichert. Das Dashboard zeigt gleich alle Ergebnisse.</p>
  </div>
</div>

<script>
const QUESTIONS = [
  { num:'01', title:'KI-Skill allgemein',   left:'Kompletter Neuling',  right:'KI-Expertin / Experte' },
  { num:'02', title:'Nutzung pro Tag',       left:'Kaum / nie',          right:'Stundenlang täglich' },
  { num:'03', title:'Hype-O-Meter',          left:'Tiefer Skeptiker',    right:'Totaler Fan' },
  { num:'04', title:'Bild-KI-Erfahrung',     left:'Noch nie genutzt',    right:'Täglich im Einsatz' },
  { num:'05', title:'Video-KI-Erfahrung',    left:'Noch nie genutzt',    right:'Täglich im Einsatz' },
  { num:'06', title:'Audio-KI-Erfahrung',    left:'Noch nie genutzt',    right:'Täglich im Einsatz' },
  { num:'07', title:'Prompting-Skill',       left:'Was ist ein Prompt?', right:'Prompt-Profi' },
  { num:'08', title:'Lernbereitschaft',      left:'Muss mich zwingen',   right:'Mega motiviert' },
  { num:'09', title:'KI im Joballtag',       left:'Kein Einsatz',        right:'Unverzichtbar' },
  { num:'10', title:'Magnific-Skill',        left:'Noch nie gehört',     right:'Spaces-Profi' },
];

const vals = new Array(10).fill(0);
const qc = document.getElementById('questions');

QUESTIONS.forEach((q,i) => {
  qc.innerHTML += `<div class="q-item">
    <div class="q-meta">
      <span class="q-num">${q.num}</span>
      <span class="q-title">${q.title}</span>
    </div>
    <input type="range" min="-10" max="10" value="0" step="1"
      oninput="vals[${i}]=parseInt(this.value)">
    <div class="poles">
      <span class="pole">${q.left}</span>
      <span class="pole right">${q.right}</span>
    </div>
  </div>`;
});

const params = new URLSearchParams(window.location.search);
const API_KEY = params.get('k') || '';
const BIN_ID  = params.get('b') || '';

async function submitData() {
  const name = document.getElementById('name-input').value.trim();
  if (!name) { setStatus('Bitte deinen Namen eingeben.'); return; }
  if (!API_KEY || !BIN_ID) { setStatus('Kein API-Key — bitte Trainer fragen.'); return; }
  const btn = document.getElementById('submit-btn');
  btn.disabled = true; setStatus('Wird gespeichert…');
  try {
    const getRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`,{headers:{'X-Master-Key':API_KEY}});
    const existing = await getRes.json();
    const entries = existing.record?.entries || [];
    entries.push({ name, values: vals, ts: Date.now() });
    const putRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`,{
      method:'PUT',
      headers:{'Content-Type':'application/json','X-Master-Key':API_KEY},
      body: JSON.stringify({entries})
    });
    if (!putRes.ok) throw new Error('Fehler beim Speichern');
    document.getElementById('main-form').style.display = 'none';
    document.getElementById('success-screen').style.display = 'flex';
  } catch(e) { btn.disabled=false; setStatus('Fehler: '+e.message); }
}
function setStatus(m) { document.getElementById('status').textContent = m; }
</script>
</body>
</html>
